databases:
  - name: adaptive-learning-db
    databaseName: adaptive_learning
    user: adapt_user
    plan: free

services:
  # Django Web Service
  - type: web
    name: adaptive-learning-platform
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn adaptive_learning.wsgi:application"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adaptive-learning-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      # Set these manually in the Render Dashboard → Environment tab
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
